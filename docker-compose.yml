######################################
# phpapp4 - Proyecto php CI4
######################################
#

services:
    nginx:
        image: nginx:1.29-alpine
        restart: "no"
        build: ./docker/nginx
        env_file:
            - ./.env
        ports:
            - 80:80
        volumes:
            - ./docker/nginx/conf.d:/etc/nginx/conf.d
            - ./app:/var/www/app
            - ./logs:/var/log/nginx
        depends_on:
            - php

    php:
        image: php8.4-fpm-alpine-pg17
        restart: "no"
        build: ./docker/app
        env_file:
            - ./.env
        volumes:
            - ./docker/app/php.ini:/usr/local/etc/php/conf.d/php.ini
            - ./app:/var/www/app
        depends_on:
            - postgres

    postgres:
        image: postgres:17-alpine
        restart: "no"
        env_file:
            - ./.env
        volumes:
            - data:/var/lib/postgresql/data
            - ./backup:/backup
            #- ./app/application/db:/db

volumes:
    data: {}
